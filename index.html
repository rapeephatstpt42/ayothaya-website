<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ayothaya · Party War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<style>
:root{color-scheme:dark;--bg:#000;--bg2:#171a20;--card:#0f1115;--ink:#f1f2f4;--mute:#8b92a3;--line:#242831;--gold:#e8b04a;--acc:#7f9bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,"Noto Sans Thai",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 16px 6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
header .sp{flex:1}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px}
nav{position:fixed;left:var(--side,0px);right:var(--side,0px);bottom:0;display:flex;background:#08090b;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:8}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:4px 0;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--gold)}
main{padding:8px 14px calc(150px + env(safe-area-inset-bottom,0px));max-width:1500px;margin:0 auto}
button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mini{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.mini:hover{border-color:var(--gold)}
input,select{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.sched{margin:0 0 10px;font-size:13px;color:var(--mute)}.sched b{color:var(--ink)}
.ttl{font-size:18px;font-weight:700;margin:0 0 10px;color:var(--gold)}
#tt{width:100%;margin-bottom:10px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.seg span{font-weight:400;font-size:12px;opacity:.8}
.layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.pool{background:var(--card);border:1px solid var(--line);padding:12px;position:fixed;left:var(--side,0px);right:var(--side,0px);bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;border-radius:16px 16px 0 0;transform:translateY(120%);visibility:hidden;transition:transform .22s,visibility .22s;z-index:7}
.pool.open{transform:none;visibility:visible}
.pool .ph{display:flex;justify-content:space-between;align-items:center}
.pool input,.pool select{width:100%;margin:8px 0 4px}
.fab{position:fixed;right:calc(14px + var(--side,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--gold);color:#000;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.chip{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;width:100%;background:none;color:inherit;font:inherit;text-align:left}
.chip:hover{background:var(--bg2)}.chip.sel{border-color:var(--gold);background:var(--bg2)}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid var(--c)}
.gi{width:28px;height:28px;flex:none;object-fit:contain}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.cl{font-size:12px;color:var(--mute);white-space:nowrap}
.ld{color:var(--gold);font-size:16px;line-height:1;text-shadow:0 0 6px rgba(232,176,74,.7)}
.ldg{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 9px;border-radius:999px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);font-weight:600;font-size:13px}
.ldg b{font-size:16px;line-height:1;font-weight:400;text-shadow:0 0 6px rgba(232,176,74,.7)}
.rc{color:var(--gold);font-size:13px}
.chg{display:block;font-size:11px;color:var(--gold);font-weight:400}
.parties{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.party{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.party h3{margin:0;padding:6px 10px;font-size:14px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center}
.party h3 span:first-child{color:var(--gold)}
.slot{display:flex;align-items:center;gap:6px;min-height:38px;padding:4px 8px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.slot.empty{color:#4a5060}.slot:hover{background:var(--bg2)}
.slot.held{outline:2px solid var(--gold);outline-offset:-2px}
.ro .slot{cursor:default}.ro .slot:hover{background:none}
#held{position:fixed;left:var(--side,0px);right:var(--side,0px);bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--gold);padding:10px 16px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.add input{flex:1;min-width:140px}
.list{max-width:760px}
.big{width:100%;font-size:16px;padding:11px 14px;margin-bottom:12px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.res h3{margin:0 0 8px;display:flex;gap:8px;align-items:center;font-size:16px}
.res p{margin:8px 0 4px;font-weight:600;font-size:14px;color:var(--gold)}
.mates{display:flex;flex-wrap:wrap;gap:6px}
.mates span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;z-index:20}
#ov[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:min(980px,100%);max-height:100%;overflow:auto}
.box img{max-width:100%;display:block;margin-top:8px;border-radius:8px}
.box textarea{width:100%;min-height:320px;font:14px/1.5 Prompt,sans-serif;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.box input{display:block;width:100%;margin:8px 0}
.err{color:#ff7a7a;font-size:13px;min-height:20px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#000;padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;display:none;max-width:90%}
/* ปุ่มสลับเวอร์ชัน */
.vm{display:inline-flex;background:var(--bg2);border-radius:999px;padding:2px;gap:2px}
.vm button{font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--mute);padding:4px 10px;border-radius:999px;cursor:pointer}
.vm button.on{background:var(--card);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
/* ลากแล้ววาง */
.chip,.slot{user-select:none;-webkit-user-select:none}
.chip[draggable=true],.slot[draggable=true]{cursor:grab}
.slot.over,.pool.over{outline:2px dashed var(--gold);outline-offset:-2px}
.hint{font-size:12px;margin:6px 0 0}
/* ===== เวอร์ชัน Phone: คอลัมน์แคบกลางจอ (ใช้บน PC ก็ได้) ===== */
body.phone{--side:max(0px,calc(50vw - 240px))}
body.phone header{max-width:480px;margin:0 auto}
body.phone main{max-width:480px}
/* ===== เวอร์ชัน Desktop ===== */
/* (เมนูซ้ายของ Desktop อยู่ท้ายส่วน CSS) */
body.desk main{padding-bottom:40px}
body.desk.holding main{padding-bottom:120px}
body.desk .layout{grid-template-columns:1fr 290px}
body.desk .layout.one{grid-template-columns:1fr}
body.desk .layout .pool{order:2}
body.desk .pool{position:sticky;top:8px;bottom:auto;left:auto;right:auto;max-height:calc(100vh - 24px);border-radius:12px;transform:none;visibility:visible}
body.desk .cls,body.desk .fab{display:none}
body.desk .parties{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
body.desk .slot{font-size:14px;padding:4px 10px}
body.desk #held{left:208px;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
/* ===== เมนูซ้าย / ไอคอน ===== */
.ni{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
nav button i{display:grid;place-items:center}
.brand,.nf{display:none}
.brand b{font-size:20px;font-weight:700;color:var(--ink)}
.brand span{font-size:12px;color:var(--mute)}
body.desk{padding-left:208px}
body.desk nav{position:fixed;left:0;right:auto;top:0;bottom:0;width:208px;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);background:#08090b;padding:16px 10px;overflow:auto}
body.desk .brand{display:flex;flex-direction:column;padding:2px 12px 14px;margin-bottom:8px;border-bottom:1px solid var(--line)}
body.desk nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px;text-align:left}
body.desk nav button:hover{background:var(--bg2)}
body.desk nav button.on{background:var(--bg2);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
body.desk .ns,body.desk .hb{display:none}
body.desk .nf{display:inline}
/* ตัวเลือกโหมดวอร์ + รายชื่อแบบดูอย่างเดียว */
.seg.modes button{padding:11px 6px;font-size:15px}
.chip.ro{cursor:default}.chip.ro:hover{background:none}
/* เปลี่ยนชื่อในเกมส์ */
.lb{display:block;font-size:13px;color:var(--mute);margin:4px 0}
.rnv{max-width:560px}
/* Trade */
.addcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:36px 12px;border:2px dashed var(--line);border-radius:14px;background:none;color:var(--mute);font:inherit;cursor:pointer}
.addcard:hover{border-color:var(--gold);color:var(--gold)}
.addcard span{font-size:34px;line-height:1}
/* ตัวเลือกโหมดวอร์ใต้ Wars (Desktop) — Phone ยังใช้แถบเลือกด้านบน */
.subnav{display:none}
body.desk .subnav{display:flex;flex-direction:column;gap:2px;margin:0 0 6px 26px;padding-left:8px;border-left:1px solid var(--line)}
body.desk nav .subnav button{font-size:14px;padding:8px 10px;gap:8px}
body.desk nav .subnav button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
body.desk nav .subnav button.on{background:none;box-shadow:none;color:var(--gold);font-weight:600}
body.desk nav .subnav button.on::before{background:var(--gold)}
body.desk .seg.modes{display:none}
/* หัวข้อใหญ่ของหน้า Wars (Desktop) */
.wh{display:none}
body.desk .wh{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.wh h2{margin:0;font-size:36px;line-height:1.15;font-weight:700}
.wh .ni{width:40px;height:40px;color:var(--gold);stroke-width:1.6}
body.desk .mt{display:none}
/* ระบบแจ้งลา */
.lvb{font-size:11px;font-weight:700;color:#ff7a7a;border:1px solid #ff7a7a;border-radius:999px;padding:0 6px;flex:none;line-height:1.5}
.slot.lvw{background:rgba(255,122,122,.12);box-shadow:inset 3px 0 0 #ff7a7a}
.lvbar{margin:0 0 10px;font-size:13px}.warn{color:#ff7a7a}
.lvh{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:15px;color:var(--gold)}.lvh .sub{flex:1}
.rs{display:block;font-size:12px;color:var(--mute);font-weight:400}
/* ===== ธีมสีสัน (Dark เป็นค่าเริ่มต้นเหมือนเดิม) ===== */
:root{--orange:#ff8a4c;--pink:#e0509b;--violet:#a78bfa;--cyan:#35d0e6;--grad:linear-gradient(135deg,#ffd36a,#ff8a4c 55%,#e0509b)}
body{background-color:#000;background-image:radial-gradient(820px 380px at 88% -90px,rgba(167,139,250,.16),transparent 65%),radial-gradient(700px 360px at 8% -70px,rgba(255,138,76,.14),transparent 65%);background-repeat:no-repeat;background-attachment:fixed}
/* โลโก้ Ayothaya (กดได้ = กลับหน้าหลัก) */
.lgm{width:34px;height:34px;border-radius:10px;background:var(--grad);display:inline-grid;place-items:center;flex:none;box-shadow:0 2px 14px rgba(255,138,76,.35);font-style:normal}
.lgm svg{width:30px;height:35px;display:block;filter:drop-shadow(0 2px 8px rgba(255,138,76,.35))}
.lgm{width:auto;height:auto;border-radius:0;background:none;box-shadow:none}
.brand b,.hl b{font-family:"Cinzel Decorative",Prompt,serif;font-weight:900;letter-spacing:.03em}
.brand b{font-size:18px}
.brand span,.hl .bt .sub{text-transform:uppercase;letter-spacing:.28em;font-size:10px;font-weight:400}
.hl .bt{display:flex;flex-direction:column;line-height:1.15}
/* ปุ่มแชร์ */
.shbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:700;padding:8px 18px 8px 14px;border-radius:999px;border:0;cursor:pointer;background:var(--grad);color:#1b1206;box-shadow:0 2px 14px rgba(255,138,76,.35)}
.shbtn:hover{filter:brightness(1.1)}.shbtn:active{transform:scale(.97)}
.shi{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admt{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}
.shopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;margin-top:10px}
.shopt:hover{border-color:var(--gold)}
.shopt svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shopt b{display:block;font-size:15px}.shopt span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.shw{min-width:min(340px,78vw)}.shw h3{margin:12px 0 0;font-size:17px;color:var(--gold)}

/* ตัวฉัน / สรุปอาชีพในปาร์ตี้ / สถิติ */
.mecard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.mecard.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mecard .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mecard .mh .mini{margin-left:auto}
.mecard .mr{padding:8px 0 2px;border-top:1px solid var(--line)}.mecard .mr>b{color:var(--gold);margin-right:8px}
.mecard .mr .mates{margin-top:6px}.mecard .mr .lvb{margin-left:6px}
.pcl{display:flex;gap:4px;align-items:center;justify-content:center;flex:1;min-width:0;margin:0 6px}
.pcs{display:inline-flex;align-items:center;gap:1px}.pcs .gi{width:20px;height:20px}.pcs .ic{width:18px;height:18px;font-size:10px}
.pcs i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink)}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.stt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stt .sv{font-size:24px;font-weight:700;color:var(--gold)}.stt .sl{font-size:13px}.stt .ss{font-size:12px;color:var(--mute)}
.sth{font-size:15px;margin:0 0 8px}
.sb{display:grid;grid-template-columns:minmax(120px,170px) 1fr 70px;gap:10px;align-items:center;padding:4px 0}
.sbn{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.sbt{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}.sbt span{display:block;height:100%;border-radius:6px}
.sbv{font-size:13px;text-align:right}.sbv small{color:var(--mute)}

body.desk .brand{gap:10px}
.brand b,.hl b{font-weight:700;background:linear-gradient(90deg,#ffd36a,#ff8a4c,#e0509b,#a78bfa,#ffd36a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.brand b,.hl b{animation:none}}
.hl{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
body.desk .brand{flex-direction:row;align-items:center;gap:11px;cursor:pointer}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand:hover .lgm,.hl:hover .lgm{filter:brightness(1.12)}
.brand:focus-visible,.hl:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
/* เมนู: แต่ละหน้ามีสีของตัวเอง */
nav button i{color:var(--a,var(--mute));opacity:.8}
nav button.on i{opacity:1}
nav button.on{color:var(--a,var(--gold))}
body.desk nav{background:linear-gradient(180deg,#0e1018,#08090b 45%)}
body.desk nav button.on{color:var(--a,var(--gold));background:color-mix(in srgb,var(--a,#e8b04a) 15%,#0b0c10);box-shadow:inset 3px 0 0 var(--a,var(--gold))}
body.desk nav .subnav button.on{color:#ff9a7a}
body.desk nav .subnav button.on::before{background:var(--orange)}
/* ปุ่มเข้า/ออกระบบ ล่างแถบเมนู (Desktop) */
.navfoot{display:none}
body.desk nav .navfoot{display:flex;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
body.desk nav .navfoot button{flex:1;justify-content:center;font-size:14px;font-weight:600;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
body.desk nav .navfoot button[data-act="login"]{background:var(--grad);color:#1b1206;border-color:transparent}
body.desk nav .navfoot button[data-act="logout"]:hover{border-color:#ff7a7a;color:#ff9a9a}
body.desk #lb{display:none}
/* หัวข้อ / การ์ด / ปุ่ม */
.ttl,.wh h2{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ttl{background-image:linear-gradient(90deg,#ffd36a,#ff8a4c)}
.wh.m-gl h2{background-image:linear-gradient(90deg,#ffd36a,#ff8a4c 55%,#ff5d8f)}
.wh.m-ov h2{background-image:linear-gradient(90deg,#7ae7ff,#35d0e6 40%,#a78bfa)}
.wh.m-gl .ni{color:var(--orange)}.wh.m-ov .ni{color:var(--cyan)}
.sched b{color:#7ae7ff}
.party{border-top:2px solid rgba(255,138,76,.55)}
.party h3{background:linear-gradient(90deg,rgba(255,138,76,.18),rgba(167,139,250,.10))}
.res{border-top:2px solid rgba(167,139,250,.6)}
.seg button.on{background:linear-gradient(135deg,rgba(255,211,106,.16),rgba(255,138,76,.14));color:#ffc46b}
.fab{background:var(--grad)}
.mini:hover{border-color:var(--orange)}
.mini[data-act="lvadd"],.mini[data-act="rename"],.mini[data-act="add"],.mini[data-act="dologin"]{background:var(--grad);color:#1b1206;border-color:transparent}

 M=m.data.map(r=>({id:r.id,n:r.name,c:r.cls,t:r.changed_at}));A=blankA();
 s.data.forEach(r=>{if(A[r.mode]&&A[r.mode][r.board])A[r.mode][r.board][r.pos]=r.member_id});
 T={};(t.data||[]).forEach(r=>T[r.key]=r.value);
 lvErr=!!lv.error;LV=lvErr?[]:(lv.data||[]).map(r=>({id:r.id,m:r.member_id,mode:r.mode,d:r.war_date,r:r.reason||''}));

let LV=[],lvErr=false,lwar='',lrs='',ldl=null;
const MTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; //k
const bkk=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Bangkok'}));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const MTHE=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName=i=>lang==='en'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]:(''+tl('วัน')+'')+DN[i];
const dlabel=s=>{const [y,m,d]=s.split('-').map(Number);return dayName(new Date(y,m-1,d).getDay())+' '+d+' '+(lang==='en'?MTHE[m-1]:MTH[m-1])};
function warDates(){
 const n=bkk(),out=[];
 for(let k=0;k<10;k++){
  const d=new Date(n);d.setDate(n.getDate()+k);
  for(const mode of['gl','ov']){
   const c=SCHED[mode];if(!c.d.includes(d.getDay()))continue;
   const en=new Date(d);en.setHours(c.e[0],c.e[1],0,0);if(n>=en)continue;
   out.push({mode,date:ymd(d)});
  }
 }
 return out;
}
const lvInfo=mode=>{const w=warDates().find(x=>x.mode===mode);return{w,ids:w?LV.filter(l=>l.mode===mode&&l.d===w.date).map(l=>l.m):[]}};
const lvSet=mode=>new Set(lvInfo(mode).ids);
function lvBar(mode){
 const li=lvInfo(mode);if(!li.w||!li.ids.length)return '';
 const u=placed(mode),inP=li.ids.filter(id=>u.has(id)).length;
 return `<p class="lvbar">🚫 ${tl('แจ้งลา {0}: <b>{1}</b> คน',dlabel(li.w.date),li.ids.length)}${inP?` · <span class="warn">⚠️ ${tl('ยังอยู่ในปาร์ตี้ {0} คน',inP)}</span>`:''} <button class="mini" data-tab="lv">${tl('ดูรายชื่อ')}</button></p>`;
}

 const form=`<div class="res"><label class="lb" for="lw">${tl('วอร์ที่จะลา')}</label><select id="lw" class="big">${wo}</select><label class="lb" for="cb-lv">${tl('ชื่อตัวละคร')}</label>${cbHTML('lv',tl('พิมพ์ชื่อตัวละคร แล้วเลือกจากรายการ'))}<label class="lb" for="lr">${tl('เหตุผล (ไม่บังคับ)')}</label><input id="lr" class="big" maxlength="100" placeholder="${tl('เช่น ติดงาน / เดินทาง')}" value="${esc(lrs)}" autocomplete="off"><div id="lm" class="err"></div><button class="mini" data-act="lvadd">${tl('แจ้งลา')}</button></div>`;
 const lst=W.map(w=>{
  const L=LV.filter(l=>l.mode===w.mode&&l.d===w.date).map(l=>({l,m:mem(l.m)})).filter(x=>x.m);
  return `<h3 class="lvh"><span>${MODES[w.mode].t} · ${dlabel(w.date)}</span><span class="sub">${tl('{0} คน',L.length)}</span>${edit?`<button class="mini" data-act="lvtxt" data-w="${w.mode}|${w.date}">${tl('คัดลอกข้อความ')}</button>`:''}</h3>`+(L.length?L.map(({l,m})=>`<div class="row">${ic(m.c)}<span class="nm">${esc(m.n)}${l.r?`<small class="rs">${esc(l.r)}</small>`:''}</span>${edit?`<button class="mini" data-act="lvdel" data-id="${l.id}">${ldl===String(l.id)?(''+tl('กดซ้ำเพื่อลบ')+''):(''+tl('ลบ')+'')}</button>`:''}</div>`).join(''):('<p class="sub" style="margin:4px 0 8px">'+tl('ยังไม่มีคนแจ้งลา')+'</p>'));
 }).join('');
 return `<div class="list rnv"><h2 class="ttl">${tl('แจ้งลาวอร์')}</h2><p class="sub" style="margin:0 0 12px">${tl('ไม่สะดวกมาวอร์? เลือกวอร์ ชื่อตัวละคร แล้วกดแจ้งลา ทุกคนจะเห็นรายชื่อคนลา ทีมจะได้จัดปาร์ตี้ได้ถูก แจ้งผิดให้ติดต่อแอดมินเพื่อลบ')}</p>${lvErr?('<p class="err">'+tl('ระบบแจ้งลายังใช้ไม่ได้: ต้องรัน SQL ใน Supabase ก่อน')+'</p>'):''}${form}${lst}</div>`;

async function doLeave(){
 const e=$('#lm');if(!e)return;
 const lid=cbResolve('lv'),m=lid&&mem(lid),w=lwar.split('|');
 if(!m){e.textContent=(''+tl('กรุณาเลือกชื่อตัวละคร')+'');return}
 if(!w[1]){e.textContent=(''+tl('กรุณาเลือกวอร์')+'');return}
 e.textContent='';
 const r=await sb.rpc('add_leave',{p_member:lid,p_mode:w[0],p_date:w[1],p_reason:lrs.trim()});
 if(r.error){const x=$('#lm');if(x)x.textContent=(''+tl('แจ้งลาไม่สำเร็จ:')+' ')+r.error.message+(/function|does not exist|schema cache/i.test(r.error.message)?(' ('+tl('ยังไม่ได้รัน SQL ใน Supabase?)')+''):'');return}

const renameView=()=>`<div class="list rnv"><h2 class="ttl">${tl('เปลี่ยนชื่อในเกมส์')}</h2><p class="sub" style="margin:0 0 12px">${tl('ตัวละครเปลี่ยนชื่อในเกม? เลือกชื่อเดิม ใส่ชื่อใหม่ แล้วกดบันทึก ชื่อในรายชื่อและทุกปาร์ตี้จะเปลี่ยนตาม และทุกคนกดดู Log ย้อนหลังได้')}</p><div class="res"><label class="lb" for="cb-rn">${tl('ชื่อเดิม')}</label>${cbHTML('rn',tl('พิมพ์ชื่อเดิม แล้วเลือกจากรายการ'))}<label class="lb" for="rn">${tl('ชื่อใหม่')}</label><input id="rn" class="big" maxlength="30" placeholder="${tl('ชื่อใหม่ในเกมส์')}" value="${esc(rnew)}" autocomplete="off"><div id="rm" class="err"></div><button class="mini" data-act="rename">${tl('บันทึกการเปลี่ยนชื่อ')}</button> <button class="mini" data-act="rlog">📜 ${tl('ดู Log')}</button></div></div>`;
async function doRename(){
 const id=cbResolve('rn'),nn=rnew.trim(),m=id&&mem(id),e=$('#rm');
 if(!e)return;
 if(!m){e.textContent=(''+tl('กรุณาเลือกชื่อเดิม')+'');return}
 if(!nn){e.textContent=(''+tl('กรุณากรอกชื่อใหม่')+'');return}
 if(nn===m.n){e.textContent=(''+tl('ชื่อใหม่เหมือนชื่อเดิม')+'');return}
 if(M.some(x=>x.id!==id&&x.n.toLowerCase()===nn.toLowerCase())){e.textContent=(''+tl('มีชื่อนี้ในรายชื่อแล้ว')+'');return}
 e.textContent='';const old=m.n;
 const r=await sb.rpc('rename_member',{p_id:id,p_new:nn});
 if(r.error){const x=$('#rm');if(x)x.textContent=(''+tl('บันทึกไม่สำเร็จ:')+' ')+r.error.message+(/function|does not exist|schema cache/i.test(r.error.message)?(' ('+tl('ยังไม่ได้รัน SQL ใน Supabase?)')+''):'');return}
 cbReset('rn');rnew='';toast(old+' → '+nn+(' '+tl('บันทึกแล้ว')+''));await load();render();
}
async function showLog(){

// ===== ช่องพิมพ์ชื่อ + รายการตัวเลือก (combobox) =====
const CBS={lv:{q:'',sel:'',hi:0},rn:{q:'',sel:'',hi:0},cc:{q:'',sel:'',hi:0},au:{q:'',sel:'',hi:0},aua:{q:'',sel:'',hi:0}};
const cbMatches=k=>{const q=CBS[k].q.trim().toLowerCase();return M.filter(x=>!q||x.n.toLowerCase().includes(q))};
const cbHTML=(k,ph)=>`<div class="cb"><input id="cb-${k}" class="big" data-cb="${k}" placeholder="${esc(ph)}" value="${esc(CBS[k].q)}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cbl-${k}"><div class="cbl" id="cbl-${k}" role="listbox" hidden></div></div>`;
function cbOpen(k){
 const c=CBS[k],box=$('#cbl-'+k),inp=$('#cb-'+k);if(!box||!inp)return;
 const L=cbMatches(k);if(c.hi>=L.length)c.hi=0;
 box.innerHTML=L.length?L.map((x,i)=>`<div class="cbo${i===c.hi?' on':''}" role="option" data-cbo="${k}" data-id="${x.id}">${ic(x.c)}<span class="nm">${esc(x.n)}</span>${(k==='au'||k==='aua')&&auCDnow().has(x.id)?'<span class="cdt">CD</span>':''}<span class="cl">${(CL[x.c]||CL.XX)[0]}</span></div>`).join(''):`<div class="cbo none">${tl('ไม่พบชื่อนี้')}</div>`;
 box.hidden=false;inp.setAttribute('aria-expanded','true');
 const on=box.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
}
function cbClose(){document.querySelectorAll('.cbl').forEach(b=>{b.hidden=true});document.querySelectorAll('[data-cb]').forEach(i=>i.setAttribute('aria-expanded','false'))}
function cbPick(k,id){const m=mem(id);if(!m)return;CBS[k].sel=id;CBS[k].q=m.n;const i=$('#cb-'+k);if(i)i.value=m.n;cbClose();if(k==='cc'){ccid=id;try{localStorage.setItem('ay_cc',id)}catch(e){}mcls='';ccRefresh()}}
function cbResolve(k){const c=CBS[k];if(c.sel&&mem(c.sel))return c.sel;const q=c.q.trim().toLowerCase();if(!q)return '';const h=M.filter(x=>x.n.toLowerCase()===q);return h.length===1?h[0].id:''}
const cbReset=k=>{CBS[k]={q:'',sel:'',hi:0}};
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('[data-cb]');if(i){cbOpen(i.dataset.cb);return}if(!(e.target.closest&&e.target.closest('.cb')))cbClose()});
document.addEventListener('focusin',e=>{const k=e.target.dataset&&e.target.dataset.cb;if(k){if(e.target.select)e.target.select();cbOpen(k)}});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.cbl'))e.preventDefault()});
document.addEventListener('keydown',e=>{
 const k=e.target.dataset&&e.target.dataset.cb;if(!k)return;
 const L=cbMatches(k),c=CBS[k],box=$('#cbl-'+k),open=box&&!box.hidden;
 if(e.key==='ArrowDown'){e.preventDefault();c.hi=Math.min(c.hi+1,Math.max(L.length-1,0));cbOpen(k)}
 else if(e.key==='ArrowUp'){e.preventDefault();c.hi=Math.max(c.hi-1,0);cbOpen(k)}
 else if(e.key==='Enter'){const x=L[c.hi];if(open&&x){e.preventDefault();cbPick(k,x.id)}}
 else if(e.key==='Escape'){cbClose()}
});

// ===== Designated Auction (ประมูลการ์ดหลังวอร์) =====
let AU={rounds:[],signups:[],winners:[]},auErr=false,auBusy=false,auReveal=null,auSig='',auDel='',auLast='';
let auMe='';try{auMe=localStorage.getItem('ay_au')||''}catch(e){}
const auTarget=()=>{const w=warDates().find(x=>x.mode==='gl');return w?w.date:''};
const auRound=d=>AU.rounds.find(r=>r.d===d);
const auSigs=d=>AU.signups.filter(x=>x.d===d&&mem(x.m)).sort((a,b)=>a.t<b.t?-1:1);
const auWins=d=>AU.winners.filter(x=>x.d===d&&x.st==='win'&&mem(x.m)).sort((a,b)=>a.seat-b.seat);
const auCD=d=>{const p=AU.rounds.filter(r=>r.st==='drawn'&&r.d<d).sort((a,b)=>a.d<b.d?1:-1)[0];return new Set(p?AU.winners.filter(x=>x.d===p.d&&x.st==='win').map(x=>x.m):[])};
const auCDnow=()=>{const d=auTarget();return d?auCD(d):new Set()};
const auState=r=>!r?'none':r.st==='drawn'?'drawn':(Date.now()>=new Date(r.closes).getTime()?'closed':'open');
const auHM=r=>r?new Date(r.closes).toLocaleTimeString('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'}):'19:20';
const auFmt=ms=>{if(ms<0)ms=0;const s=Math.floor(ms/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return (dd?dd+tt('ว ','d '):'')+p2(h)+':'+p2(m)+':'+p2(x)};
const AUCARD='<svg viewBox="0 0 64 88" aria-hidden="true"><defs><linearGradient id="auG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcc6ff"/><stop offset=".55" stop-color="#9b6bff"/><stop offset="1" stop-color="#e0509b"/></linearGradient></defs><rect x="3" y="3" width="58" height="82" rx="9" fill="#150e27" stroke="url(#auG)" stroke-width="2.4"/><rect x="9" y="9" width="46" height="70" rx="5" fill="none" stroke="url(#auG)" stroke-opacity=".5"/><path d="M32 22l4.8 10.6L47.5 37l-10.7 4.4L32 52l-4.8-10.6L16.5 37l10.7-4.4z" fill="url(#auG)"/><path d="M10 66l14-6 8 7 10-8 12 9" fill="none" stroke="url(#auG)" stroke-width="2" stroke-linejoin="round" stroke-opacity=".8"/></svg>';
async function auLoad(){
 if(!sb)return false;
 try{
  const since=ymd(new Date(bkk().getTime()-35*864e5));

async function auAct(a,t){

 if(a==='au-add'){
  const id=cbResolve('au'),m=id&&mem(id),e=$('#aum');

  if(auCD(d).has(id)){if(e)e.textContent=tt('ติด CD รอบนี้ (ได้สิทธิ์รอบก่อน)','On cooldown this round (won last round)');return}

 else if(a==='au-cancel'){if(auMe)await rpc('au_cancel',{p_member:auMe,p_date:d},tt('ยกเลิกการลงชื่อแล้ว','Withdrawn'))}

 else if(a==='au-oadd'){

 else if(a==='au-reset'){if(auDel==='reset'){auDel='';await rpc('au_reset',{p_date:d},tt('รีเซ็ตแล้ว','Reset'))}else{auDel='reset';render()}}

 else if(a==='au-skip'){auReveal=null;render()}
}
function auPlay(){
 const rv=auReveal;if(!rv)return;
 const W=auWins(rv.d),pool=auSigs(rv.d).map(x=>mem(x.m)).filter(Boolean),slots=[...document.querySelectorAll('#austage .au-slot')];
 if(!slots.length||matchMedia('(prefers-reduced-motion:reduce)').matches){auReveal=null;render();return}
 let i=0;
 const fin=()=>{if(auReveal===rv){auReveal=null;render()}};
 const next=()=>{
  if(auReveal!==rv)return;
  if(i>=slots.length){setTimeout(fin,700);return}
  const el=slots[i],w=W[i],m=mem(w.m),f=el.querySelector('.au-face');let n=0;
  el.classList.add('spin');
  const tick=setInterval(()=>{
   if(auReveal!==rv){clearInterval(tick);return}
   const p=pool[Math.floor(Math.random()*pool.length)];f.textContent=p?p.n:'';
   if(++n>13){clearInterval(tick);el.classList.remove('spin');el.classList.add('land');f.innerHTML=`${ic(m.c)}<b class="nm">${esc(m.n)}</b><small>${(CL[m.c]||CL.XX)[0]}</small>`;i++;setTimeout(next,600)}
  },70);
 };
 next();
}

(()=>{let d=null;
 document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.hn');if(!h)return;d=h;try{h.setPointerCapture(e.pointerId)}catch(er){}e.preventDefault()});
 document.addEventListener('pointermove',e=>{if(!d)return;const r=d.parentElement.getBoundingClientRect();HORN.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));HORN.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));d.style.left=HORN.x*100+'%';d.style.top=HORN.y*100+'%'});
 ['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{d=null}));
})();
const wbImg=k=>(WARS.find(w=>w.t.indexOf({st:'Stellar',vl:'Vale',vg:'Vigrid'}[k])===0)||{}).i;
/*WP*/
const WPM={st:{n:'Stellar Clash',ph:['ยึด 3 จุด','Boss ปรากฏ']},vl:{n:'Vale of Clash',ph:['ยึดเสา','Fiesta Tempo']},vg:{n:'Vigrid Avenge',ph:['ชิง Horn','คุ้มกัน Horn','Fiesta Tempo']}};
let wp={ok:0,load:0,plans:[],map:'st',pid:null,ph:0,sel:null,err:'',del:0};
async function wpLoad(){wp.load=1;const r=await sb.from('war_boards').select('*').order('created_at');if(r.error)wp.err=r.error.message;else{wp.err='';wp.plans=r.data||[]}wp.ok=1;wp.load=0;render()}
const wpCur=()=>wp.plans.find(p=>p.id===wp.pid&&p.map===wp.map);
const wpSave=p=>run(sb.from('war_boards').update({title:p.title,data:p.data,active:p.active,updated_at:new Date().toISOString()}).eq('id',p.id));
const wpData=m=>({ph:WPM[m].ph.map(n=>({n,pos:{},role:{},note:''}))});
function wbView(){
 if(!wp.ok&&!wp.load)setTimeout(wpLoad,0);
 const M=WPM[wp.map],list=wp.plans.filter(p=>p.map===wp.map);
 let p=wpCur();if(!p&&list.length){p=list.find(x=>x.active)||list[0];wp.pid=p.id}
 let h=`<div class="list"><div class="seg modes">${['gl','ov'].map(k=>`<button data-mode="${k}">${MODES[k].t}</button>`).join('')}<button data-tab="wp" class="on">${tl('แผนวอร์')}</button></div><h2 class="ttl">${tt('แผนวอร์ (สนามหลัก)','War Plan (Main Battlefield)')}</h2>`;
 if(wp.err)return h+`<p class="err">${tt('ใช้งานไม่ได้: ต้องรันไฟล์ warboards.sql ใน Supabase ก่อน','Not ready: run warboards.sql in Supabase first')} (${esc(wp.err)})</p></div>`;
 h+=`<div class="seg">${Object.keys(WPM).map(k=>`<button data-wp="map" data-v="${k}" class="${k===wp.map?'on':''}">${WPM[k].n}</button>`).join('')}</div>`;
 h+=`<div class="seg">${list.map(x=>`<button data-wp="plan" data-v="${x.id}" class="${p&&x.id===p.id?'on':''}">${x.active?'⭐ ':''}${esc(x.title)}</button>`).join('')}${edit?`<button data-wp="new">＋ ${tt('แผนใหม่','New plan')}</button>`:''}</div>`;
 if(!p)return h+`<p class="sub">${tt('ยังไม่มีแผนสำหรับแผนที่นี้','No plan for this map yet')}</p></div>`;
 wp.ph=Math.min(wp.ph,p.data.ph.length-1);const f=p.data.ph[wp.ph],pos=f.pos;
 h+=`<div class="seg">${p.data.ph.map((x,i)=>`<button data-wp="ph" data-v="${i}" class="${i===wp.ph?'on':''}">${esc(x.n)}</button>`).join('')}${edit?'<button data-wp="addph">＋</button>':''}</div>`;
 h+=`<div class="wpmap" id="wpmap"><img src="${wbImg(wp.map)}" alt="" draggable="false">${wp.map==='vg'?`<button class="wbh" data-wp="horn" style="left:${(f.horn||[52.1,47.75])[0]}%;top:${(f.horn||[52.1,47.75])[1]}%">${HORNSVG}</button>`:''}${Object.keys(pos).map(n=>`<button class="wpt${wp.sel==n?' sel':''}" style="left:${pos[n][0]}%;top:${pos[n][1]}%" data-wp="tok" data-v="${n}">${n}</button>`).join('')}</div>`;
 h+=`<div class="wptray">${[1,2,3,4,5,6,7,8].filter(n=>!pos[n]).map(n=>`<button class="wpt st${wp.sel==n?' sel':''}" data-wp="tok" data-v="${n}">${n}</button>`).join('')}${edit&&wp.sel&&pos[wp.sel]?`<button class="mini" data-wp="rm">${tt('ถอดโทเคน','Remove')}</button>`:''}</div>`;
 if(edit)h+=`<p class="sub">${wp.sel?tt('แตะแผนที่เพื่อวางปาร์ตี้ '+wp.sel,'Tap the map to place party '+wp.sel):tt('แตะเลขปาร์ตี้ แล้วแตะแผนที่','Tap a party number, then the map')}</p>`;
 h+=`<div class="wpl">${[1,2,3,4,5,6,7,8].map(n=>{const ms=A.gl.m.slice((n-1)*5,n*5).map(id=>id&&mem(id)).filter(Boolean);return `<div class="wpp"><b>${n}</b><div class="wpm">${ms.map(m=>`<span>${ic(m.c)}${esc(m.n)}</span>`).join('')||'<small>—</small>'}</div>${edit?`<input data-wp="role" data-n="${n}" placeholder="${tt('หน้าที่','Role')}" value="${esc(f.role[n]||'')}">`:(f.role[n]?`<em>${esc(f.role[n])}</em>`:'')}</div>`}).join('')}</div>`;
 h+=edit?`<textarea data-wp="note" rows="3" placeholder="${tt('โน้ตของเฟสนี้','Phase note')}">${esc(f.note||'')}</textarea><div class="seg"><input data-wp="phname" value="${esc(f.n)}"><button data-wp="delph">${tt('ลบเฟส','Del phase')}</button></div><div class="seg"><input data-wp="title" value="${esc(p.title)}"><button data-wp="act">⭐ ${tt('ใช้วันนี้','Use today')}</button><button data-wp="copy">${tt('ก๊อปแผน','Copy')}</button><button data-wp="del">${wp.del?tt('ยืนยันลบ','Confirm'):tt('ลบแผน','Delete')}</button></div>`:(f.note?`<p class="sub">${esc(f.note)}</p>`:'');
 return h+'</div>'}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-wp]'),mp=e.target.closest('#wpmap'),p=wpCur();if(wp.moved){wp.moved=0;return}
 if(!t&&mp&&edit&&wp.sel&&p){const r=mp.getBoundingClientRect();p.data.ph[wp.ph].pos[wp.sel]=[+((e.clientX-r.left)/r.width*100).toFixed(1),+((e.clientY-r.top)/r.height*100).toFixed(1)];wpSave(p);wp.sel=null;render();return}
 if(!t||/INPUT|TEXTAREA/.test(t.tagName))return;
 const a=t.dataset.wp,v=t.dataset.v,d=wp.del;wp.del=0;
 if(a==='map'){wp.map=v;wp.pid=null;wp.ph=0;wp.sel=null}
 else if(a==='plan'){wp.pid=v;wp.ph=0;wp.sel=null}
 else if(a==='ph')wp.ph=+v;
 else if(a==='tok'){if(edit)wp.sel=wp.sel==v?null:v}
 else if(a==='horn')return;
 else if(!edit)return;
 else if(a==='rm'&&p){delete p.data.ph[wp.ph].pos[wp.sel];wp.sel=null;wpSave(p)}
 else if(a==='new'||a==='copy'){const n={id:crypto.randomUUID(),map:wp.map,title:a==='new'?tt('แผน ','Plan ')+(wp.plans.filter(x=>x.map===wp.map).length+1):p.title+tt(' (ก๊อป)',' (copy)'),data:a==='new'?wpData(wp.map):JSON.parse(JSON.stringify(p.data)),active:false};wp.plans.push(n);wp.pid=n.id;wp.ph=0;run(sb.from('war_boards').insert(n))}
 else if(a==='addph'&&p){p.data.ph.push({n:tt('เฟส ','Phase ')+(p.data.ph.length+1),pos:{},role:{},note:''});wp.ph=p.data.ph.length-1;wpSave(p)}
 else if(a==='delph'&&p&&p.data.ph.length>1){p.data.ph.splice(wp.ph,1);wp.ph=0;wpSave(p)}
 else if(a==='act'&&p){wp.plans.forEach(x=>{if(x.map===wp.map)x.active=x===p});run((async()=>{const r=await sb.from('war_boards').update({active:false}).eq('map',wp.map);return r.error?r:sb.from('war_boards').update({active:true}).eq('id',p.id)})())}
 else if(a==='del'&&p){if(d){wp.plans=wp.plans.filter(x=>x!==p);wp.pid=null;wp.ph=0;run(sb.from('war_boards').delete().eq('id',p.id))}else wp.del=1}
 render()});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset&&t.dataset.wp,p=wpCur();if(!a||!edit||!p)return;const f=p.data.ph[wp.ph];
 if(a==='role')f.role[t.dataset.n]=t.value.trim();else if(a==='phname'){f.n=t.value.trim()||f.n}else if(a==='note')f.note=t.value;else if(a==='title'){p.title=t.value.trim()||p.title}else return;wpSave(p);if(a==='title'||a==='phname')render()});
(()=>{let d=null,sx=0,sy=0,mv=0;
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('#wpmap [data-wp=tok],#wpmap [data-wp=horn]');if(!el||!edit)return;d=el;mv=0;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!d)return;if(!mv&&Math.hypot(e.clientX-sx,e.clientY-sy)<5)return;mv=1;const r=d.parentElement.getBoundingClientRect();d.style.left=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100))+'%';d.style.top=Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100))+'%'});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(!d)return;const el=d;d=null;if(!mv)return;wp.moved=1;setTimeout(()=>wp.moved=0,60);const p=wpCur(),f=p&&p.data.ph[wp.ph];if(!f)return;const x=+parseFloat(el.style.left).toFixed(1),y=+parseFloat(el.style.top).toFixed(1);if(el.dataset.wp==='horn')f.horn=[x,y];else f.pos[el.dataset.v]=[x,y];wpSave(p)}))})();
let wpMode='info';
function wpView(){const tg=`<div class="seg"><button data-wm="info" class="${wpMode==='info'?'on':''}">${tt('ข้อมูลวอร์','War Info')}</button><button data-wm="plan" class="${wpMode==='plan'?'on':''}">${tt('วางแผน','Plan Board')}</button></div>`;return (wpMode==='plan'?wbView():wpInfo()).replace('<h2 class="ttl">',tg+'<h2 class="ttl">')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-wm]');if(t){wpMode=t.dataset.wm;render()}});
function wpInfo(){
 const seg=`<div class="seg modes">${['gl','ov'].map(k=>`<button data-mode="${k}">${MODES[k].t}</button>`).join('')}<button data-tab="wp" class="on">${tl('แผนวอร์')}</button></div>`;
 const vg=w=>`<div class="bar" style="margin:8px 0">${HORN.on?`<button class="mini" data-hn="home">↩ ${tt('กลับจุดกลาง','Back to center')}</button><button class="mini" data-hn="off">✕ ${tt('เก็บ Horn','Hide Horn')}</button>`:`<button class="mini" style="border-color:var(--gold);color:var(--gold)" data-hn="spawn">📯 Spawn Horn</button>`}</div><div class="hnw"><img src="${w.i}" alt="${w.t}" style="aspect-ratio:${w.ar}">${HORN.on?`<button class="hn" style="left:${HORN.x*100}%;top:${HORN.y*100}%" aria-label="Horn">${HORNSVG}</button>`:''}</div><p class="sub hint">${tt('ลากไอคอน Horn เพื่อย้ายตำแหน่ง (เห็นเฉพาะในเครื่องคุณ)','Drag the Horn to move it (only on your device)')}</p>`;
 return `<div class="list">${seg}<h2 class="ttl">${tl('แผนวอร์')}</h2><p class="sub">${tl('แตะรูปแผนที่เพื่อดูภาพใหญ่')}</p>${WARS.map(w=>`<section class="wi"><h3>${w.t}</h3>${w.ar?vg(w):`<img data-wz="1" src="${w.i}" alt="${w.t}">`}<ul>${w.l.map(x=>`<li>${x}</li>`).join('')}</ul>${w.k}</section>`).join('')}</div>`;
}
// ===== สลับภาษา =====
function applyLang(){
 document.documentElement.lang=lang;document.title=tl('Ayothaya · ปาร์ตี้วอร์');
 const set=(s,k,v)=>{const e=$(s);if(e)e.setAttribute(k,v)};
 set('#vm','aria-label',tl('เลือกเวอร์ชันหน้าเว็บ'));set('#vm [data-vm="desk"]','title',tl('เวอร์ชันคอมพิวเตอร์'));set('#vm [data-vm="phone"]','title',tl('เวอร์ชันมือถือ'));
 set('#lg','aria-label',tl('เลือกภาษา'));
 document.querySelectorAll('header [data-act="home"]').forEach(e=>e.setAttribute('title',tl('กลับหน้าหลัก')));
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
 const lb=$('#lb');if(lb)lb.textContent=user?tl('ออกจากระบบ'):tl('เข้าสู่ระบบ Officer');
 const w=$('#who');if(w)w.textContent=edit?tl('โหมดแก้ไข'):'';
}
function setLang(l){if(l!=='th'&&l!=='en')return;lang=l;try{localStorage.setItem('ay_lang',l)}catch(e){}applyLang();render()}
(async()=>{
 if(auRoute())page='au';
 applyLang();
 if(CFG.url.startsWith('http')&&window.supabase){
  sb=supabase.createClient(CFG.url,CFG.key);
  await checkEditor();await load();
  setInterval(()=>{if(!edit&&!document.hidden)load()},60000);
 }
 render();
})();
</script>
